<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUUSD Trading Game</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <h1>XAUUSD Local Trading Game</h1>
    <div id="status">Initialisation...</div>
  </header>

  <main>
    <section class="panel">
      <h2>Marché</h2>
      <div id="priceChart"></div>
      <div class="row">
        <button id="btnStep">STEP</button>
        <button id="btnRun">RUN</button>
        <button id="btnPause">PAUSE</button>
        <button id="recenter">RECENTER</button>
        <label>Vitesse(ms): <input id="speed" type="number" value="500" min="50" step="50" /></label>
      </div>
      <div id="events" class="events"></div>
    </section>

    <section class="panel">
      <h2>Trading</h2>
      <div class="row">
        <input id="size" type="number" step="0.1" value="1" />
        <input id="leverage" type="number" step="1" value="50" />
        <button id="buy">BUY</button>
        <button id="sell">SELL</button>
      </div>
      <div class="row">
        <button id="closeAll">CLOSE ALL</button>
        <button id="close10">CLOSE 10%</button>
        <button id="close20">CLOSE 20%</button>
        <button id="close50">CLOSE 50%</button>
      </div>
      <div class="row">
        <input id="cashAmount" type="number" value="1000" step="100" />
        <button id="deposit">DEPOSIT</button>
        <button id="withdraw">WITHDRAW</button>
        <button id="reset">RESTART / RESET TOTAL</button>
      </div>
    </section>

    <section class="panel">
      <h2>Portefeuille temps réel</h2>
      <pre id="metrics"></pre>
      <h3>Positions</h3>
      <div id="positions"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
